version: 2
project_name: spinup
# Keep hook outputs outside the directory GoReleaser initializes after hooks.
dist: dist/artifacts

env:
  - GOTOOLCHAIN=local
  - GOFLAGS=-mod=readonly
  - SYFT_CHECK_FOR_APP_UPDATE=false

git:
  ignore_tags: ["kit/*"]

before:
  hooks:
    - go run ./scripts/release/templates --version {{ .Version }} --snapshot={{ .IsSnapshot }}

builds:
  - id: spinup
    main: ./cmd/spinup
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/stopyellingatme/spinup/internal/cli.Version={{ .Version }} -X github.com/stopyellingatme/spinup/internal/cli.Commit={{ .Commit }} -X github.com/stopyellingatme/spinup/internal/cli.Date={{ .CommitDate }}

binary_signs:
  - cmd: cosign
    artifacts: binary
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, --yes, --bundle, "${signature}", "${artifact}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: scripts/release/README.md
        strip_parent: true
      - LICENSE*
      - CHANGELOG*

sboms:
  - artifacts: binary
    cmd: syft
    env:
      - SYFT_CHECK_FOR_APP_UPDATE=false
      - SYFT_CACHE_DIR=
      - SYFT_GOLANG_SEARCH_REMOTE_LICENSES=false
      - SYFT_GOLANG_USE_PACKAGES_LIB=false
    documents: ["spinup_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.json"]
    args: ["scan", "file:${artifact}", "--output", "spdx-json=${document}"]

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: dist/extra/*
    - glob: install.sh

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, --yes, --bundle, "${signature}", "${artifact}"]

homebrew_casks:
  - name: spinup
    repository:
      owner: stopyellingatme
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/stopyellingatme/spinup
    description: Generate and operate an upgradable Go and SvelteKit stack
    skip_upload: "{{ or .IsSnapshot .IsPrerelease }}"
    binaries: [spinup]

dockers_v2:
  - id: ci
    ids: [spinup]
    dockerfile: Dockerfile.ci
    images: [ghcr.io/stopyellingatme/spinup-ci]
    tags: ["{{ .Version }}"]
    platforms: [linux/amd64, linux/arm64]
    # Snapshots omit the image build and push. Offline checks also use --skip=docker.
    disable: "{{ .IsSnapshot }}"

release:
  github:
    owner: stopyellingatme
    name: spinup
  prerelease: auto
  extra_files:
    - glob: dist/extra/*
    - glob: install.sh

snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  disable: true
