  openapi-typescript: 7.13.0
  openapi-fetch: 0.17.0
  "@hey-api/openapi-ts": 0.99.0           # opt-in client (M10)
  vitest: 5.0.4
  "@playwright/test": 1.64.0
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/sdk-node": 0.223.0
  "@opentelemetry/exporter-trace-otlp-http": 0.223.0
  "@opentelemetry/instrumentation-undici": 0.33.0   # required: without it fetch to Go carries no traceparent
  "@opentelemetry/auto-instrumentations-node": 0.81.0
  import-in-the-middle: 3.5.2
  prettier: 3.9.10
  eslint: 10.12.0
  renovate: 44.155.8

