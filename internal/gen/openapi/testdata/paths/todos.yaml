/api/todos:
  get:
    operationId: listTodos
    responses:
      '200':
        description: Todos
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Todo'
  post:
    operationId: createTodo
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateTodo'
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Todo'
      '400':
        description: Invalid request
        content:
          application/problem+json:
            schema:
              $ref: '#/components/schemas/Problem'
/api/todos/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  get:
    operationId: getTodo
    responses:
      '200':
        description: Todo
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Todo'
