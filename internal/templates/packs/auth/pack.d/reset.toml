source = "embed/routes/reset/confirm/+page.ts"
class = "scaffold"
when = "frontend_mode == 'embed' && modules contains 'mail'"

[[files]]
path = "web/src/routes/reset/confirm/+page.svelte"
source = "embed/routes/reset/confirm/+page.svelte"
class = "scaffold"
when = "frontend_mode == 'embed' && modules contains 'mail'"

[[files]]
path = "web/src/routes/reset/confirm/schema.ts"
source = "embed/routes/reset/confirm/schema.ts"
class = "scaffold"
when = "frontend_mode == 'embed' && modules contains 'mail'"

