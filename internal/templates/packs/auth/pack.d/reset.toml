# The pages of embed mode (ADR 0039, sections 10.1 and 10.3). The browser calls the Go API on the same
# origin. The node pages above keep the form actions. An alternate path expression keeps the metadata
# key of a page unique, because the node page has the same output path. The mail link of embed mode is
# /reset/confirm#<token>: the fragment never reaches a server (kit auth.WithResetFragment).

[[files]]
path = "web/src/routes/reset/+page.ts"
source = "embed/routes/reset/+page.ts"
class = "scaffold"
when = "frontend_mode == 'embed' && modules contains 'mail'"

[[files]]
path = '[[ "web/src/routes/reset/+page.svelte" ]]'
source = "embed/routes/reset/+page.svelte"
class = "scaffold"
when = "frontend_mode == 'embed' && modules contains 'mail'"

[[files]]
path = "web/src/routes/reset/schema.ts"
source = "embed/routes/reset/schema.ts"
class = "scaffold"
when = "frontend_mode == 'embed' && modules contains 'mail'"

