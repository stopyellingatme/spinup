# cargo-nextest settings (main loop only). The version is pinned in scripts/rust/tools-check.sh.
[store]
dir = "target/nextest"

[profile.default]
# Lanes set NEXTEST_TEST_THREADS=4 (ADR 0019 §5). A slow test prints a note after 60 s and
# fails after 5 minutes (the generated-app builds of the doctest pages take the longest).
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

[profile.ci]
# GitHub Actions (.github/workflows/rust.yml): retry once to show flaky tests, and write JUnit.
retries = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
