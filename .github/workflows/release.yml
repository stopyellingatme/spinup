name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go.sum
            kit/go.sum
      - name: Check the tagged release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SPINUP_TEMPLATES_SIGNING_KEY: ${{ secrets.SPINUP_TEMPLATES_SIGNING_KEY }}
        run: scripts/release/check.sh "${RELEASE_TAG#v}" --tagged
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SPINUP_TEMPLATES_SIGNING_KEY: ${{ secrets.SPINUP_TEMPLATES_SIGNING_KEY }}
      - name: Attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/artifacts/spinup_*.tar.gz
            dist/artifacts/spinup_*.zip
            dist/extra/templates-v*.tar.zst
      - name: Publish the kit tag on the same commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          kit_tag="kit/$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$kit_tag"; then
            test "$(git rev-parse "$kit_tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$kit_tag" HEAD
          fi
          git push origin "refs/tags/$kit_tag"
