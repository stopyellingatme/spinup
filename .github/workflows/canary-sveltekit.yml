name: SvelteKit canary

# Weekly check of a generated web app against the newest SvelteKit stack.
# A failure here means the next stack bump will need work.

on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go.sum
            kit/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - name: Generate a web app
        run: |
          go build -o "$RUNNER_TEMP/spinup" ./cmd/spinup
          cd "$RUNNER_TEMP"
          SPINUP_KIT_REPLACE="$GITHUB_WORKSPACE/kit" ./spinup new canary \
            --module example.com/canary --modules ci,auth --no-git --non-interactive
      - name: Bump the web stack to the latest versions
        working-directory: ${{ runner.temp }}/canary/web
        run: |
          pnpm update --latest @sveltejs/kit svelte vite bits-ui
          pnpm dlx shadcn-svelte@latest add --all --yes --overwrite
      - name: Install without the frozen lockfile
        working-directory: ${{ runner.temp }}/canary/web
        run: pnpm install --no-frozen-lockfile
      - name: Check the types
        working-directory: ${{ runner.temp }}/canary/web
        run: pnpm check
      - name: Build
        working-directory: ${{ runner.temp }}/canary/web
        env:
          PUBLIC_ORIGIN: http://localhost:3000
          API_URL: http://localhost:8080
        run: pnpm build

  report:
    needs: canary
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "SvelteKit canary failed" \
            --body "The weekly canary failed with the latest SvelteKit stack. See ${RUN_URL}."
