# The Rust workspace CI (docs/design/rust-plan.md §6, ADR 0020 §9). Main loop only.
# It runs fmt, clippy, nextest, and the parity subset on ubuntu, macOS, and Windows, and the
# open R0 checks on native runners (R0.3 registry, R0.4 runner, R0.5 interop; REPORT.md
# "Open items"). At R5 this workflow becomes ci.yml.
name: Rust

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  # The app gate (make rs-app-gate) runs only on request: it needs Docker and the network.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  GOTOOLCHAIN: local
  # Keep in step with scripts/rust/tools-check.sh and the cargo_tools of
  # crates/spinup-stack/stackversions.yaml.
  NEXTEST_VERSION: 0.9.146
  LLVM_COV_VERSION: 0.9.1
  DENY_VERSION: 0.20.2
  SQLX_CLI_VERSION: 0.9.0
  # The query macros read the committed .sqlx/ data (ADR 0021 §2, §3).
  SQLX_OFFLINE: "true"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Check the format
        run: cargo fmt --all --check
      - name: Check that the Rust stack file is current
        run: scripts/rust/gen-stack.sh --check

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: clippy-${{ runner.os }}-
      # The kit has a self dev-dependency with every feature, so clippy compiles all kit code.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # A missing dep: entry hides behind the self dev-dependency: check each feature set.
      - name: Kit feature sets
        if: runner.os == 'Linux'
        run: make rs-kit-features

  nextest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest*
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: nextest-${{ runner.os }}-${{ env.NEXTEST_VERSION }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: nextest-${{ runner.os }}-${{ env.NEXTEST_VERSION }}-
      - name: Install cargo-nextest
        run: |
          if ! cargo nextest --version 2>/dev/null | grep -q "^cargo-nextest $NEXTEST_VERSION "; then
            cargo install --locked cargo-nextest --version "$NEXTEST_VERSION"
          fi
      # The kit tests need PostgreSQL (tests named pg_, ADR 0021 §2). A services block does not
      # work in a matrix with macOS and Windows, so each system starts its own server.
      - name: Start PostgreSQL on Linux
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          for _ in $(seq 1 30); do docker exec pg pg_isready -U postgres > /dev/null 2>&1 && break; sleep 1; done
          echo "DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable" >> "$GITHUB_ENV"
      - name: Start PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --quiet postgresql@18
          pg="$(brew --prefix postgresql@18)/bin"
          "$pg/initdb" --pgdata="$RUNNER_TEMP/pg" --username=postgres --auth=trust >/dev/null
          "$pg/pg_ctl" --pgdata="$RUNNER_TEMP/pg" --log="$RUNNER_TEMP/pg.log" --options="-p 5432 -k $RUNNER_TEMP" --wait start
          echo "DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable" >> "$GITHUB_ENV"
      # make rs-test: every test except packs_digest (a gate check), then the doc tests.
      # Windows has no PostgreSQL: it skips the pg_ tests.
      - name: Nextest
        run: |
          filter='not test(packs_digest)'
          if [[ $RUNNER_OS == Windows ]]; then filter="$filter and not test(/(^|::)pg_/)"; fi
          cargo nextest run --workspace --locked --profile ci -E "$filter"
      # The kit examples compile on every system. Examples that need a database or a
      # network are no_run (ADR 0021 §2).
      - name: Doc tests
        run: cargo test --workspace --locked --doc

  # The scripts of testdata/script/parity.txt with the Rust binary (make rs-script). The Go
  # script harness does not run on Windows (scripts/ci/windows-excluded.txt), so this job
  # runs on Linux and macOS. The golden parity tests run in the nextest job on all three.
  # The R2 scripts render apps with the kit patch (SPINUP_KIT_DIR, set by make) and build
  # them in target/apps, so they need pnpm, bun, sqlx-cli, and PostgreSQL.
  parity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go.sum
            kit/go.sum
      - name: Prepare the test machine
        uses: ./.github/actions/prepare-tests
        with:
          tools: shellcheck bun
          warm: go node
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # target holds target/apps, the shared target dir of the generated apps.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: parity-${{ runner.os }}-${{ env.SQLX_CLI_VERSION }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/spinup-packs/overlay/api/files/api/Cargo.lock') }}
          restore-keys: parity-${{ runner.os }}-${{ env.SQLX_CLI_VERSION }}-
      # sqlx-cli cannot install with --locked. The sqlx-toml feature gives migrate run --config.
      - name: Install sqlx-cli
        run: |
          if ! sqlx migrate run --help 2>/dev/null | grep -q -- --config; then
            cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --no-default-features --features postgres,rustls,sqlx-toml --force
          fi
      # The kit tests need PostgreSQL (tests named pg_, ADR 0021 §2). A services block does not
      # work in a matrix with macOS and Windows, so each system starts its own server.
      - name: Start PostgreSQL on Linux
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          for _ in $(seq 1 30); do docker exec pg pg_isready -U postgres > /dev/null 2>&1 && break; sleep 1; done
          echo "DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable" >> "$GITHUB_ENV"
      - name: Start PostgreSQL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --quiet postgresql@18
          pg="$(brew --prefix postgresql@18)/bin"
          "$pg/initdb" --pgdata="$RUNNER_TEMP/pg" --username=postgres --auth=trust >/dev/null
          "$pg/pg_ctl" --pgdata="$RUNNER_TEMP/pg" --log="$RUNNER_TEMP/pg.log" --options="-p 5432 -k $RUNNER_TEMP" --wait start
          echo "DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable" >> "$GITHUB_ENV"
      - name: The converted packs are current
        run: make rs-convert-check
      - name: The parity scripts with the Rust binary
        run: make rs-script

  # Line coverage (make rs-cover: a 70 percent floor for each of merge, manifest, migrate,
  # and upgrade).
  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cover-${{ runner.os }}-${{ env.NEXTEST_VERSION }}-${{ env.LLVM_COV_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cover-${{ runner.os }}-${{ env.NEXTEST_VERSION }}-${{ env.LLVM_COV_VERSION }}-
      - name: Install cargo-nextest and cargo-llvm-cov
        run: |
          if ! cargo nextest --version 2>/dev/null | grep -q "^cargo-nextest $NEXTEST_VERSION "; then
            cargo install --locked cargo-nextest --version "$NEXTEST_VERSION"
          fi
          if ! cargo llvm-cov --version 2>/dev/null | grep -q "^cargo-llvm-cov $LLVM_COV_VERSION$"; then
            cargo install --locked cargo-llvm-cov --version "$LLVM_COV_VERSION"
          fi
      - name: Coverage
        run: make rs-cover

  # The frozen reference app of R0.9 still compiles (make rs-ref-check). It needs no database.
  ref-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/ref
          key: ref-${{ runner.os }}-${{ hashFiles('testdata/reference/todo-rs/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ref-${{ runner.os }}-
      - name: Fetch the reference crates
        run: cd testdata/reference/todo-rs && cargo fetch --locked
      - name: Reference app
        run: make rs-ref-check

  # Supply chain: bans, licenses, sources, and the advisory database (make rs-deny, rs-vuln).
  # rs-deny also runs scripts/rust/cli-graph-check.sh (no tokio or aws-lc in the binary).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: deny-${{ runner.os }}-${{ env.DENY_VERSION }}
      - name: Install cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -q "^cargo-deny $DENY_VERSION$"; then
            cargo install --locked cargo-deny --version "$DENY_VERSION"
          fi
      - name: Fetch the locked crates
        run: cargo fetch --locked
      - name: Bans, licenses, and sources
        run: make rs-deny
      - name: Advisories
        run: make rs-vuln

  # The R0 checks that need native Linux and Windows runners (REPORT.md "Open items"):
  # R0.3 registration (debug, release, and fat LTO, with the wire mutations of verify.py),
  # R0.4 the sync runner, and R0.5 the format interop and path policy.
  spikes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # With RUSTUP_TOOLCHAIN set, rustup skips the components of rust-toolchain.toml.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
      # spike-check.sh calls python3. Windows runners name the interpreter python.
      - name: Provide python3
        run: |
          if ! command -v python3 > /dev/null; then
            mkdir -p "$RUNNER_TEMP/py"
            printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/py/python3"
            chmod +x "$RUNNER_TEMP/py/python3"
            echo "$RUNNER_TEMP/py" >> "$GITHUB_PATH"
          fi
      # spike-check.sh builds offline, so fetch each spike workspace first.
      - name: Fetch the spike crates
        run: |
          for dir in spikes-rs/r0-03-linkme spikes-rs/r0-04-runtime spikes-rs/r0-05-interop; do
            (cd "$dir" && cargo fetch --locked)
          done
      - name: R0.3 registration
        run: scripts/rust/spike-check.sh r0-03
      - name: R0.3 registration matrix (debug, release, fat LTO)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/r0-03-target
        run: |
          cd spikes-rs/r0-03-linkme
          python3 verify.py --output "$RUNNER_TEMP/r0-03-${{ runner.os }}.json"
      - name: R0.4 runner
        run: scripts/rust/spike-check.sh r0-04
      - name: R0.5 interop
        run: scripts/rust/spike-check.sh r0-05
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: r0-03-${{ runner.os }}
          path: ${{ runner.temp }}/r0-03-${{ runner.os }}.json
          if-no-files-found: ignore

  # The app gate (make rs-app-gate, R2 gate item 2): generate, build, test, and serve the
  # gate apps. Only on request: it needs Docker, PostgreSQL, and the network.
  app-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go.sum
            kit/go.sum
      - name: Prepare the test machine
        uses: ./.github/actions/prepare-tests
        with:
          tools: shellcheck bun
          warm: go node
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --no-default-features --features postgres,rustls,sqlx-toml --force
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          for _ in $(seq 1 30); do docker exec pg pg_isready -U postgres > /dev/null 2>&1 && break; sleep 1; done
          echo "DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable" >> "$GITHUB_ENV"
      - name: App gate
        run: make rs-app-gate
