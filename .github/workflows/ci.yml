name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go.sum
            kit/go.sum
      - name: Lint the CLI
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: Lint the kit
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: kit

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.26.x", "1.27.x"]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            kit/go.sum
      - name: Test the CLI with the race detector
        run: go test -race ./...
      - name: Test the kit with the race detector
        run: cd kit && go test -race ./...

  windows:
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.sum
            kit/go.sum
      # The whole CLI must compile on Windows, even the Unix-only packages.
      - name: Vet every package for Windows
        run: go vet ./... && (cd kit && go vet ./...)
      - name: Build the CLI for Windows
        run: go build -o /dev/null ./cmd/spinup
      # Test only the packages that support Windows. The list and the reasons
      # for each exclusion are in scripts/ci/windows-excluded.txt.
      - name: Test the portable packages
        run: |
          packages="$(scripts/ci/windows-packages.sh)"
          # shellcheck disable=SC2086
          go test $packages

  golden:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go.sum
            kit/go.sum
      - name: Test the golden trees
        run: make golden
      - name: Test the CLI scripts
        run: make script

  actionlint:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify and run actionlint
        shell: bash
        run: |
          temp_dir=$(mktemp -d)
          release_url=https://github.com/rhysd/actionlint/releases/download/v1.7.12
          curl --fail --silent --show-error --location "$release_url/actionlint_1.7.12_linux_amd64.tar.gz" --output "$temp_dir/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location "$release_url/actionlint_1.7.12_checksums.txt" --output "$temp_dir/actionlint_1.7.12_checksums.txt"
          (
            cd "$temp_dir"
            sha256sum -c --ignore-missing actionlint_1.7.12_checksums.txt
            tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          )
          "$temp_dir/actionlint"
