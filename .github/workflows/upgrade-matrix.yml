name: Upgrade matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: |
            go.sum
            kit/go.sum
            testdata/golden/**/go.sum
            testdata/golden/**/tools.sum
            testdata/corpus/**/go.sum
            testdata/corpus/**/tools.sum
      - name: Prepare the test machine
        uses: ./.github/actions/prepare-tests
        with:
          tools: actionlint
          warm: go
      - name: Upgrade frozen apps and build the results
        run: SPINUP_MATRIX_BUILD=1 go test -race -run 'Matrix|LockSchema' ./internal/upgrade/
      - name: Require template migration decisions
        run: go test -run PacksDigest ./internal/templates/

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Cache dependencies for generated apps
        working-directory: kit
        run: go mod download
      - name: Measure upgrade coverage
        run: go test -coverprofile=cover.out ./internal/merge/... ./internal/upgrade/... ./internal/manifest/... ./internal/migrate/...
      - name: Require 70 percent in each package
        shell: bash
        run: |
          go list ./internal/merge/... ./internal/upgrade/... ./internal/manifest/... ./internal/migrate/... > coverage-packages.txt
          failed=0
          while IFS= read -r package; do
            awk -v package="$package" '
              NR == 1 { print; next }
              { file = $1; sub("/[^/]*$", "", file) }
              file == package { print }
            ' cover.out > package.cover
            percentage=$(go tool cover -func=package.cover | awk '/^total:/ { sub(/%$/, "", $3); print $3 }')
            printf '%s: %s%% statement coverage\n' "$package" "$percentage"
            if ! awk -v percentage="$percentage" 'BEGIN { exit !(percentage != "" && percentage + 0 >= 70) }'; then
              failed=1
            fi
          done < coverage-packages.txt
          exit "$failed"
