# The file selections of the Go golden tests (internal/templates/golden_*_test.go and
# internal/testutil/golden_sample_test.go), for the Rust golden tests (spinup-testutil
# `filter`, units R1.14 to R1.16). Main loop only (ADR 0020 §8).
#
# Each [golden."<name>"] table describes one tree of testdata/golden/<name>/:
#   packs     the packs to render, in render order
#   answers   the render answers
#   sub       optional: take only the files below this directory, without the prefix
#   prefixes  optional: take the files whose path starts with one of these prefixes
#   paths     optional: also take these exact paths
#   exclude   optional: drop these exact paths
#   mode      "keep" keeps the rendered modes. "0644" sets every mode to 0644, as the Go test does.
# Without sub, prefixes, and paths, the test takes every rendered file.
# The Rust tests also skip every path that ends with one of skip_suffixes (R1 does not run
# go/format, rust-plan.md "R1 scope").

skip_suffixes = [".go"]

# TestGolden_sample
[golden."_sample"]
packs = ["_sample"]
answers = { app_name = "demo", db = "postgres", auth = true, modules = ["jobs", "mail"], greeting = "Hello" }
mode = "keep"

# TestGoldenSecrets
[golden."secrets"]
packs = ["base", "api", "secrets"]
answers = { app_name = "todo", module = "example.com/todo", modules = "ci,secrets" }
paths = [".sops.yaml", "secrets/.gitkeep"]
mode = "0644"

# TestGoldenTofu
[golden."tofu"]
packs = ["base", "api", "deploy", "tofu"]
answers = { app_name = "todo", module = "example.com/todo", modules = "deploy,tofu" }
sub = "deploy/infra/tofu"
mode = "keep"

# TestGoldenBackups (backupsFiles)
[golden."backups"]
packs = ["base", "api", "web", "deploy", "backups"]
answers = { app_name = "todo", module = "example.com/todo", modules = "ci,deploy,backups" }
paths = ["deploy/compose.backups.yml", "deploy/pgbackrest/pgbackrest.conf", "deploy/backups/run.sh", "deploy/systemd/spinup-todo-backup-full.service", "deploy/systemd/spinup-todo-backup-full.timer", "deploy/systemd/spinup-todo-backup-diff.service", "deploy/systemd/spinup-todo-backup-diff.timer", "deploy/systemd/spinup-todo-backup-verify.service", "deploy/systemd/spinup-todo-backup-verify.timer"]
mode = "keep"

# TestGoldenMonitoring/lite
[golden."monitoring/lite"]
packs = ["base", "api", "web", "deploy", "monitoring"]
answers = { app_name = "todo", module = "example.com/todo", modules = "ci,deploy,monitoring", monitoring_profile = "lite" }
prefixes = ["monitoring/"]
mode = "keep"

# TestGoldenMonitoring/full
[golden."monitoring/full"]
packs = ["base", "api", "web", "deploy", "monitoring"]
answers = { app_name = "todo", module = "example.com/todo", modules = "ci,deploy,monitoring", monitoring_profile = "full" }
prefixes = ["monitoring/"]
mode = "keep"

