# Managed by spinup: `spinup upgrade` keeps this file current. Put your own rules in
# monitoring/alerts/custom.yml.
#
# The API alerts. The kit sends HTTP RED metrics over OTLP (otelhttp):
# http_server_request_duration_seconds, with the API service name as the job label (<app>-api).
# The web service exports traces only. Web request metrics are out of scope.
groups:
  - name: app
    rules:
      # No traffic can also cause missing request metrics. This is a telemetry warning.
      - alert: APIRequestMetricsMissing
        expr: absent_over_time(http_server_request_duration_seconds_count[10m])
        labels:
          severity: warning
        annotations:
          summary: "API: no request metrics for 10 minutes"
          description: "The API stopped sending HTTP request metrics. Check the API and Alloy. An API with no requests can also trigger this alert."

      - alert: HighErrorRate
        expr: |
          (
            sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            /
            sum by (job) (rate(http_server_request_duration_seconds_count[5m]))
          ) > 0.05
          and
          sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }}: more than 5% of the requests fail"
          description: "{{ $labels.job }} answered {{ $value | humanizePercentage }} of the requests with a 5xx status in the last 5 minutes."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (job, le) (rate(http_server_request_duration_seconds_bucket[5m]))) > 1
          and
          sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }}: the p95 latency is above 1 s"
          description: "The 95th percentile of the request duration of {{ $labels.job }} is {{ $value | humanizeDuration }}."

  - name: backups
    rules:
      # Alloy reads the metrics file on the VM in both profiles.
      - record: backup_last_age_seconds
        expr: time() - max by (job) (backup_last_success_timestamp_seconds)

      - alert: BackupVerifyFailed
        expr: backup_last_verify_ok == 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }}: the backup verification failed"
          description: "Run spinup backup verify and inspect the backup repository."

      - alert: BackupStale
        expr: max by (job) (backup_last_age_seconds) > 26 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }}: the newest backup is older than 26 hours"
          description: "The newest database backup is {{ $value | humanizeDuration }} old. Run spinup backup now and check spinup backup list."
