[package]
name = "service"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
# OpenTelemetry (ADR 0023): OTLP over HTTP to the collector, no TLS, no gRPC.
opentelemetry = "=0.33.1"
opentelemetry_sdk = { version = "=0.33.1", features = ["trace", "testing"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry-http = "=0.33.1"
tracing-opentelemetry = "=0.34.0"

[dev-dependencies]
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", features = ["util"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
