# Managed by spinup. pnpm 12 refuses to install when a dependency's build script is neither
# allowed nor denied (ADR 0002 rule 9). List each one here.
allowBuilds:
  esbuild: true
  protobufjs: false
# @hey-api/json-schema-ref-parser pins js-yaml 4.2.0, which has security advisories. Remove this
# override when that package requires js-yaml 4.3.2 or later.
overrides:
  "js-yaml@<4.3.2": 4.3.2
