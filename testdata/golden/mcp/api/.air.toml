root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
entrypoint = ["./tmp/api"]
delay = 300
include_ext = ["go", "sql"]
include_dir = []
exclude_dir = ["tmp", "node_modules", "internal/gen", "internal/store"]
exclude_regex = ["_test.go"]
exclude_unchanged = true
stop_on_error = true
send_interrupt = true
kill_delay = "4s"

[log]
time = false
main_only = true

[misc]
clean_on_exit = true
