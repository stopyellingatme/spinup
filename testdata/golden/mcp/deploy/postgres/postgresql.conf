# Managed by spinup: `spinup upgrade` keeps this file current.
# Put your own settings in conf.d/*.conf. A later setting wins.
#
# Postgres reads this file through `-c config_file` (compose.edge.yml). The data directory
# and pg_hba.conf stay in the volume.

listen_addresses = '*'

# Both colors connect during a blue/green switch, so the connection pools double (ADR 0003).
max_connections = 200

shared_buffers = 128MB
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB

log_timezone = 'Etc/UTC'
timezone = 'Etc/UTC'

include_dir = 'conf.d'
