      in: path
      required: true
      schema:
        type: integer
        format: int64
  get:
    operationId: getNote
    summary: Get a note
    tags: [notes]
    responses:
      "200":
        description: The note.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Note"
      "400":
        description: The request is malformed.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      "404":
        description: The note does not exist.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      "401":
        description: A signed-in user is required.
