            $ref: "#/components/schemas/NoteInput"
    responses:
      "200":
        description: The updated note.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Note"
      "400":
        description: The request is malformed.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      "404":
        description: The note does not exist.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      "409":
        description: The request conflicts with other data.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      "413":
        description: The request body exceeds 1 MiB.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      "422":
        description: The request has invalid values.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      "401":
        description: A signed-in user is required.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      "403":
        description: The signed-in user does not have a required role.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      default:
        description: An unexpected error.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
  delete:
    operationId: deleteNote
    summary: Delete a note
    tags: [notes]
    responses:
      "204":
        description: The note is deleted.
      "400":
        description: The request is malformed.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      "404":
        description: The note does not exist.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      "409":
        description: The request conflicts with other data.
        content:
          application/problem+json:
            schema:
              $ref: "#/components/schemas/Problem"
      "401":
        description: A signed-in user is required.
        content:
          application/problem+json:
