AuditEvent:
  type: object
  required: [id, occurred_at, action, table, record_id, changes, actor]
  properties:
    id:
      type: integer
      format: int64
    occurred_at:
      type: string
      format: date-time
    action:
      type: string
    table:
      type: string
    record_id:
      type: string
    owner_id:
      type: integer
      format: int64
    changes:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
    actor:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
        id:
          type: integer
          format: int64
        email:
          type: string
        role:
          type: string
        source:
          type: string
        reason:
          type: string
        request_id:
          type: string
AuditEventList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: "#/components/schemas/AuditEvent"
