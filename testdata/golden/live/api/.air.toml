root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
entrypoint = ["./tmp/api"]
delay = 300
include_ext = ["go", "sql"]
include_dir = []
# internal/store is watched: a query edit rebuilds on the .sql change, and again when sqlc
# writes the new store code. exclude_unchanged stops a rebuild when sqlc writes the same bytes.
exclude_dir = ["tmp", "node_modules", "internal/gen"]
exclude_regex = ["_test.go"]
exclude_unchanged = true
stop_on_error = true
send_interrupt = true
kill_delay = "4s"

[log]
time = false
main_only = true

[misc]
clean_on_exit = true
