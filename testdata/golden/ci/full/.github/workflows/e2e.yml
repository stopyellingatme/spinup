# Managed by spinup. Add extensions in a separate workflow file.
name: End-to-end tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
      PUBLIC_ORIGIN: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:8080
      E2E_BASE_URL: http://127.0.0.1:3000
      SPINUP_ENV: dev
      GOTOOLCHAIN: local
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - name: Install the web dependencies and Chromium
        working-directory: web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Migrate the database
        working-directory: api
        run: |
          set -euo pipefail
          go run ./cmd/api migrate up
      - name: Build the web app
        working-directory: web
        run: |
          set -euo pipefail
          pnpm build
      - name: Start the API and the web app, then run Playwright
        shell: bash
        run: |
          set -euo pipefail
          (cd api && PORT=8080 go run ./cmd/api) > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          (cd web && PORT=3000 HOST=127.0.0.1 node build) > "$RUNNER_TEMP/web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for url in "$API_URL/healthz" "$PUBLIC_ORIGIN/healthz"; do
            ready=false
            for ((attempt=0; attempt<120; attempt++)); do
              if curl --fail --silent --output /dev/null --max-time 2 "$url"; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              printf 'Health check failed: %s\n' "$url" >&2
              printf '%s\n' 'Try: reproduce with DATABASE_URL, PUBLIC_ORIGIN, and API_URL from this workflow.' >&2
              exit 1
            fi
          done
          cd web
          pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
