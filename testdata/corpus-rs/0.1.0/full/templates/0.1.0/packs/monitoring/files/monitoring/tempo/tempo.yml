# Managed by spinup: `spinup upgrade` keeps this file current.
#
# Tempo as one process with local storage in the tempo_data volume (profile full). Alloy sends
# the traces over OTLP/HTTP. compose.monitoring.yml sets the retention with flags from
# TEMPO_RETENTION (default 336h, 14 days).
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
