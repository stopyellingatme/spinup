package_update: true
package_upgrade: true
packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - ufw
  - fail2ban
  - unattended-upgrades

swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

write_files:
  # Validate this staged policy before it becomes active.
  - path: /run/spinup-todo-sudoers
    permissions: "0440"
    content: |
      deploy ALL=(root) NOPASSWD: /usr/bin/systemctl daemon-reload, /usr/bin/systemctl enable --now spinup-todo-backup-full.timer, /usr/bin/systemctl disable --now spinup-todo-backup-full.timer, /usr/bin/systemctl start --now spinup-todo-backup-full.timer, /usr/bin/systemctl stop --now spinup-todo-backup-full.timer, /usr/bin/install -m 0644 /opt/todo/backups/spinup-todo-backup-full.service /etc/systemd/system/spinup-todo-backup-full.service, /usr/bin/install -m 0644 /opt/todo/backups/spinup-todo-backup-full.timer /etc/systemd/system/spinup-todo-backup-full.timer, /usr/bin/systemctl enable --now spinup-todo-backup-diff.timer, /usr/bin/systemctl disable --now spinup-todo-backup-diff.timer, /usr/bin/systemctl start --now spinup-todo-backup-diff.timer, /usr/bin/systemctl stop --now spinup-todo-backup-diff.timer, /usr/bin/install -m 0644 /opt/todo/backups/spinup-todo-backup-diff.service /etc/systemd/system/spinup-todo-backup-diff.service, /usr/bin/install -m 0644 /opt/todo/backups/spinup-todo-backup-diff.timer /etc/systemd/system/spinup-todo-backup-diff.timer, /usr/bin/systemctl enable --now spinup-todo-backup-verify.timer, /usr/bin/systemctl disable --now spinup-todo-backup-verify.timer, /usr/bin/systemctl start --now spinup-todo-backup-verify.timer, /usr/bin/systemctl stop --now spinup-todo-backup-verify.timer, /usr/bin/install -m 0644 /opt/todo/backups/spinup-todo-backup-verify.service /etc/systemd/system/spinup-todo-backup-verify.service, /usr/bin/install -m 0644 /opt/todo/backups/spinup-todo-backup-verify.timer /etc/systemd/system/spinup-todo-backup-verify.timer, /usr/bin/rm -f /etc/systemd/system/spinup-todo-backup-full.timer /etc/systemd/system/spinup-todo-backup-full.service /etc/systemd/system/spinup-todo-backup-diff.timer /etc/systemd/system/spinup-todo-backup-diff.service /etc/systemd/system/spinup-todo-backup-verify.timer /etc/systemd/system/spinup-todo-backup-verify.service
  # Log rotation for every container (the Compose files set the same values).
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
  - path: /etc/systemd/journald.conf.d/90-spinup.conf
    permissions: "0644"
    content: |
      [Journal]
      SystemMaxUse=500M
  - path: /etc/ssh/sshd_config.d/10-spinup.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers deploy
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      bantime = 1h
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/sysctl.d/90-spinup.conf
    permissions: "0644"
    content: |
      vm.swappiness = 10
      net.core.somaxconn = 4096

runcmd:
  - [sh, -ec, "visudo -cf /run/spinup-todo-sudoers && mv -f /run/spinup-todo-sudoers /etc/sudoers.d/spinup-todo"]
  - [usermod, -aG, docker, deploy]
  - [install, -d, -o, deploy, -g, deploy, -m, "0750", /opt/todo, /opt/todo/releases, /opt/todo/backups, /opt/todo/data, /opt/todo/data/caddy, /opt/todo/data/caddy/data, /opt/todo/data/caddy/config, /opt/todo/caddy, /opt/todo/postgres]
  - [install, -d, -o, deploy, -g, deploy, -m, "0700", /opt/todo/secrets]
  - [sysctl, --system]
  - [systemctl, restart, systemd-journald]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, 22/tcp]
  - [ufw, allow, 80/tcp]
  - [ufw, allow, 443/tcp]
  - [ufw, allow, 443/udp]
  - [ufw, --force, enable]
  - [systemctl, enable, --now, fail2ban]
  - [systemctl, enable, --now, unattended-upgrades]
  - [systemctl, enable, --now, docker]
  - [systemctl, restart, ssh]
