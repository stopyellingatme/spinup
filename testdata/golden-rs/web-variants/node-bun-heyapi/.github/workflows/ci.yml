# Managed by spinup. Regenerated on upgrade.
# Add extensions in a separate workflow file.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        shell: bash
        working-directory: api
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app?sslmode=disable
      SQLX_OFFLINE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('api/Cargo.lock', 'api/rust-toolchain.toml') }}
      - name: Check the API
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check the query cache
        run: |
          set -euo pipefail
          cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls,sqlx-toml
          cargo run --locked -- migrate up
          SQLX_OFFLINE=false cargo sqlx prepare --check --workspace -- --all-targets
      - name: Check the OpenAPI spec
        run: |
          set -euo pipefail
          cargo run --locked -- openapi > "$RUNNER_TEMP/openapi.yaml"
          diff -u openapi/bundle.gen.yaml "$RUNNER_TEMP/openapi.yaml"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: |
          set -euo pipefail
          npm install --global bun@1.4.2
      - run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check
          # A new app has no unit tests. Playwright runs in its own workflow.
          bun run test --passWithNoTests

  spinup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' api/rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: |
          set -euo pipefail
          npm install --global bun@1.4.2
      - uses: ./.github/actions/setup-spinup
      - run: |
          set -euo pipefail
          cp .env.example .env
          chmod 0600 .env
          spinup check --allow-behind
          spinup doctor
