[package]
# The openidconnect 4 candidate of the R0.7 OIDC comparison. It runs the
# token cases of the kit OIDC tests against the same fake issuer.
name = "oidc-compare"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
openidconnect.workspace = true

[dev-dependencies]
kit = { package = "spinup-kit", path = "../kit", features = ["test-util"] }
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
