[package]
# The crates.io name of the kit. The generated app depends on it by this name.
name = "spinup-kit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "kit"

[features]
# test-util exports the fake OIDC issuer and the SMTP stub for tests of other crates.
test-util = []

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
form_urlencoded = "1.2.2"
hex.workspace = true
jsonwebtoken.workspace = true
lettre.workspace = true
oauth2.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
time.workspace = true
tokio.workspace = true
tower-sessions.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
# The integration tests use the fake OIDC issuer and the SMTP stub.
spinup-kit = { path = ".", features = ["test-util"] }
http-body-util.workspace = true
tower.workspace = true
