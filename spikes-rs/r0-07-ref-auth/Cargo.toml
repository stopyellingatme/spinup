[workspace]
resolver = "3"
# kit and todo-api are the reference app (R0.6 plus auth). oidc-compare holds
# the openidconnect candidate for the OIDC crate comparison. The shipped app
# (todo-api) does not depend on it.
members = ["kit", "todo-api", "oidc-compare"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys", "alloc"] }
axum = { version = "0.8.9", features = ["macros"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
http-body-util = "0.1.5"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "file-transport", "hostname"] }
oauth2 = { version = "5.0.0", default-features = false }
openidconnect = "4.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "time", "json", "derive"] }
subtle = "2.6.1"
time = { version = "0.3.55", features = ["serde", "serde-human-readable", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-sessions = { version = "0.15.0", default-features = false, features = ["axum-core"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["yaml", "uuid", "time", "axum_extras"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }

# argon2id with 64 MiB and 3 passes takes about 1 s per hash in an
# unoptimized build, so a dev server and the tests answer logins slowly and
# the 429 Retry-After of the txtar replay drifts below 3600. Optimize the
# hash crates in the dev profile too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
