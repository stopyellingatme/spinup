[package]
name = "gen"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# `gen` is a reserved keyword in edition 2024, so the library has another name.
[lib]
name = "spinup_gen"

[dependencies]
anyhow.workspace = true
hex = "0.4.3"
minijinja = { version = "3.0.3", features = ["builtins", "loop_controls", "serde"] }
prettyplease = "0.3.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
syn = { version = "3.0.9", features = ["full", "parsing", "printing"] }
