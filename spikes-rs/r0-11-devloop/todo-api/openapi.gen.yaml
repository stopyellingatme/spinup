components:
  schemas:
    Article:
      type: object
      required:
      - id
      - title
      - body
      - published
      - created_at
      - updated_at
      properties:
        body:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        published:
          type: boolean
        title:
          type: string
        updated_at:
          type: string
          format: date-time
    ArticleInput:
      type: object
      required:
      - title
