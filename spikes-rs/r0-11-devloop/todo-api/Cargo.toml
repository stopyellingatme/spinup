[package]
name = "todo-api"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["auth", "jobs", "telemetry"]
# Without auth, `serve` has only the todo routes: no session layer and no
# startup argon2 hash. R0.12 measures the start time with and without it.
auth = []
jobs = ["kit/jobs"]
telemetry = ["kit/telemetry"]
# mimalloc as the global allocator. R0.12 measures the binary with and
# without it.
mimalloc = ["dep:mimalloc"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
listenfd.workspace = true
kit = { package = "spinup-kit", path = "../kit", default-features = false }
mimalloc = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
http-body-util.workspace = true
reqwest.workspace = true
tower.workspace = true
