# bacon 3.26 job for the R0.11 dev loop measurement: `bacon --headless`
# runs the default job and restarts it on each change.
default_job = "serve"

[jobs.serve]
command = ["cargo", "run", "--offline", "--locked", "-p", "todo-api", "--", "serve"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
watch = ["todo-api/src", "kit/src"]
