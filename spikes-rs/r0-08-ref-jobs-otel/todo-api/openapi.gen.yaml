openapi: 3.1.0
info:
  title: todo
  version: 0.1.0
servers:
- url: /
paths:
  /api/todos:
    get:
      tags:
      - todos
      summary: List todos
      operationId: listTodos
      parameters:
      - name: limit
        in: query
        description: The number of todos to return.
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - name: offset
        in: query
        description: The number of todos to skip.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      responses:
        '200':
          description: A page of todos in id order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
        '400':
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request has invalid values.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: An unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - todos
      summary: Create a todo
      operationId: createTodo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
        required: true
      responses:
        '201':
          description: The new todo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with other data.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request has invalid values.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: An unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/todos/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - todos
      summary: Get a todo
      operationId: getTodo
      responses:
        '200':
          description: The todo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The todo does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: An unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
      - todos
      summary: Replace a todo
      operationId: updateTodo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
        required: true
      responses:
        '200':
          description: The updated todo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The todo does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with other data.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request has invalid values.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: An unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - todos
      summary: Delete a todo
      operationId: deleteTodo
      responses:
        '204':
          description: The todo is deleted.
        '400':
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The todo does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with other data.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: An unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
        instance:
          type: string
        request_id:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
    Todo:
      type: object
      required:
      - id
      - title
      - done
      - due
      - priority
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        done:
          type: boolean
        due:
          type:
          - string
          - 'null'
          format: date
        id:
          type: integer
          format: int64
        priority:
          type: string
          enum:
          - low
          - normal
          - high
        title:
          type: string
        updated_at:
          type: string
          format: date-time
    TodoInput:
      type: object
      required:
      - title
      - done
      - priority
      properties:
        done:
          type: boolean
        due:
          type:
          - string
          - 'null'
          format: date
        priority:
          type: string
          enum:
          - low
          - normal
          - high
        title:
          type: string
    TodoList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
        total:
          type: integer
          format: int64
