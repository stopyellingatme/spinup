[package]
# The crates.io name of the kit. The generated app depends on it by this name,
# so a [patch.crates-io] entry can point it at a path before it is published.
name = "spinup-kit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "kit"

[features]
default = ["jobs", "telemetry"]
# The own job queue on sqlx (River schema).
jobs = ["dep:fastrand", "dep:futures"]
# Traces, metrics, and logs over OTLP HTTP, and the HTTP metric layer.
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
anyhow.workspace = true
axum.workspace = true
fastrand = { workspace = true, optional = true }
form_urlencoded = "1.2.2"
futures = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_urlencoded.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util.workspace = true
opentelemetry-proto.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
prost.workspace = true
regex = "1"
tower.workspace = true
