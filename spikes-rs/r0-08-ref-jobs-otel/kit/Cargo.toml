[package]
name = "kit"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
fastrand = "2.5.0"
futures = "0.3.34"
garde = { version = "0.23.0", features = ["derive", "email", "regex", "unicode"] }
http-body-util = "0.1.5"
opentelemetry = { version = "0.33.1", features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-client", "trace", "metrics", "logs"] }
opentelemetry-semantic-conventions = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio", "trace", "metrics", "logs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "time", "json", "derive"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "cors", "timeout", "limit", "util", "fs", "set-header"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
utoipa = { version = "6.0.0", features = ["yaml", "uuid", "time", "axum_extras", "preserve_order"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
