[package]
name = "r0-02-minijinja"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.104"
minijinja = { version = "3.0.3", features = ["builtins", "json", "loop_controls", "macros", "serde", "preserve_order", "urlencode"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
toml = "1.1.8"
walkdir = "2.5.0"
yaml_serde = "0.10.7"
