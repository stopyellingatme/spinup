[package]
# The crates.io name of the kit. The generated app depends on it by this name.
name = "spinup-kit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "kit"

[features]
default = ["jobs", "telemetry"]
# The own job queue on sqlx (River schema), from R0.8.
jobs = ["dep:fastrand", "dep:futures"]
# Traces, metrics, and logs over OTLP HTTP, and the HTTP metric layer (R0.8).
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]
# test-util exports the fake OIDC issuer and the SMTP stub for tests of other crates.
test-util = []

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
fastrand = { workspace = true, optional = true }
flate2.workspace = true
form_urlencoded = "1.2.2"
futures = { workspace = true, optional = true }
hex.workspace = true
jsonwebtoken.workspace = true
lettre.workspace = true
oauth2.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
time.workspace = true
tokio.workspace = true
tower-sessions.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber.workspace = true
url.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
# The integration tests use the fake OIDC issuer and the SMTP stub.
spinup-kit = { path = ".", features = ["test-util"] }
http-body-util.workspace = true
opentelemetry-proto.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
prost.workspace = true
regex = "1"
tower.workspace = true
