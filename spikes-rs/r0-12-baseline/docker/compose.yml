# The read-only check of the images. measure.py starts each service with
# `docker compose up --wait` and records the time to the healthy state.
# DATABASE_URL points at the host Postgres (127.0.0.1:55433 on the host).
x-api: &api
  read_only: true
  environment:
    DATABASE_URL: ${R12_DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:55433/spinup_r12?sslmode=disable}
    PORT: "8080"
  healthcheck:
    test: ["CMD", "/api", "healthcheck"]
    interval: 1s
    timeout: 2s
    retries: 10
    start_period: 0s
    start_interval: 100ms

services:
  api-musl:
    <<: *api
    image: r0-12/api-musl
    ports: ["127.0.0.1:18091:8080"]
  api-glibc:
    <<: *api
    image: r0-12/api-glibc
    ports: ["127.0.0.1:18092:8080"]
