[package]
name = "cli-skel"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "string", "wrap_help"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
inquire = "0.9.4"
libc = "0.2.191"
mimalloc = "0.1.52"
minijinja = { version = "3.0.3", features = ["builtins", "json", "loop_controls", "macros", "serde", "preserve_order", "urlencode"] }
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
ureq = { version = "3.5.0", features = ["json"] }
walkdir = "2.5.0"
zstd = "0.14.3"
