[package]
name = "cli-skel"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "spinup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive", "env", "string", "wrap_help"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
ed25519-dalek = "3.0.0"
inquire = "0.9.4"
minijinja = { version = "3.0.3", features = ["builtins", "json", "loop_controls", "macros", "serde", "urlencode"] }
regex = "1.13.1"
# The R0.4 client: ureq with rustls and an explicit ring provider (no tokio).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = "0.4.46"
toml = "1.1.8"
toml_edit = "0.25.17"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
walkdir = "2.5.0"
zstd = "0.14.3"

[build-dependencies]
sha2.workspace = true
tar = "0.4.46"
zstd = "0.14.3"
