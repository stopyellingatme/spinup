[package]
name = "app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["linkme"]
linkme = ["registry/linkme", "reg-a/linkme", "reg-b/linkme"]
inventory = ["registry/inventory", "reg-a/inventory", "reg-b/inventory"]

[dependencies]
registry = { path = "../registry", default-features = false }
reg-a = { path = "../reg-a", default-features = false }
reg-b = { path = "../reg-b", default-features = false }
