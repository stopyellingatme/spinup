[package]
name = "r0-01-yaml"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[features]
default = ["path", "edit", "splice"]
path = ["dep:yamlpath", "dep:yamlpatch", "dep:yaml_serde"]
edit = ["dep:yaml-edit"]
splice = ["dep:tree-sitter", "dep:tree-sitter-yaml"]

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = { version = "0.27.1", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
yaml-edit = { version = "0.3.5", optional = true }
yaml_serde = { version = "0.10.7", optional = true }
yamlpatch = { version = "1.31.1", optional = true }
yamlpath = { version = "1.31.1", optional = true }
