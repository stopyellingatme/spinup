# The spinup Cargo workspace (docs/design/rust-plan.md §1, ADR 0020).
# Only the main loop edits this file (CLAUDE.md, "Shared files"). Lanes never add a crate,
# a feature, or a version. A lane that needs one reports `blocked: <crate>`.
#
# Versions are exact (`=x.y.z`). They come from the R0 spike locks in spikes-rs/*/Cargo.lock.

[workspace]
resolver = "3"
members = [
  "crates/spinup-ui",
  "crates/spinup-compat",
  "crates/spinup-vfs",
  "crates/spinup-manifest",
  "crates/spinup-stack",
  "crates/spinup-editors",
  "crates/spinup-exec",
  "crates/spinup-project",
  "crates/spinup-packs",
  "crates/spinup-tplstore",
  "crates/spinup-render",
  "crates/spinup-merge",
  "crates/spinup-doctor",
  "crates/spinup-plugin-api",
  "crates/spinup-migrate",
  "crates/spinup-gen",
  "crates/spinup-upgrade",
  "crates/spinup-drift",
  "crates/spinup-newapp",
  "crates/spinup-cli",
  "crates/spinup",
  "crates/spinup-testutil",
  "crates/spinup-kit",
  "crates/spinup-db",
  "crates/spinup-build",
  "crates/spinup-appcmd",
  "crates/spinup-gen-web",
  "crates/spinup-gen-app",
]
# Each spike in spikes-rs/ is its own workspace (ADR 0019). testdata holds the reference app,
# the golden-rs trees, and the corpus, which have their own Cargo.toml files (ADR 0021).
exclude = ["spikes-rs", "testdata"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stopyellingatme/spinup"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# The root clippy.toml bans std::process::Command (only spinup-exec runs subprocesses).
disallowed_methods = "warn"
disallowed_types = "warn"

[workspace.dependencies]
# Workspace crates. Each crate lists only the edges of docs/design/rust-layers.toml.
base64 = "=0.23.1"                                                        # R1: decode Go []byte oracle fields (diffs, hashes, render)
spinup-ui = { path = "crates/spinup-ui" }
spinup-compat = { path = "crates/spinup-compat" }
spinup-vfs = { path = "crates/spinup-vfs" }
spinup-manifest = { path = "crates/spinup-manifest" }
spinup-stack = { path = "crates/spinup-stack" }
spinup-editors = { path = "crates/spinup-editors" }
spinup-exec = { path = "crates/spinup-exec" }
spinup-project = { path = "crates/spinup-project" }
spinup-packs = { path = "crates/spinup-packs" }
spinup-tplstore = { path = "crates/spinup-tplstore" }
spinup-render = { path = "crates/spinup-render" }
spinup-merge = { path = "crates/spinup-merge" }
spinup-doctor = { path = "crates/spinup-doctor" }
spinup-plugin-api = { path = "crates/spinup-plugin-api" }
spinup-migrate = { path = "crates/spinup-migrate" }
spinup-gen = { path = "crates/spinup-gen" }
spinup-upgrade = { path = "crates/spinup-upgrade" }
spinup-drift = { path = "crates/spinup-drift" }
spinup-newapp = { path = "crates/spinup-newapp" }
spinup-cli = { path = "crates/spinup-cli" }
spinup-testutil = { path = "crates/spinup-testutil" }
spinup-kit = { path = "crates/spinup-kit" }
spinup-db = { path = "crates/spinup-db" }
spinup-build = { path = "crates/spinup-build" }
spinup-appcmd = { path = "crates/spinup-appcmd" }
spinup-gen-web = { path = "crates/spinup-gen-web" }
spinup-gen-app = { path = "crates/spinup-gen-app" }

# External crates (R1). The R0 spike that chose each version is in the comment.
anyhow = "=1.0.104"                                                       # all spikes
cap-std = "=4.0.3"                                                        # R0.5 path policy
clap = { version = "=4.6.7", features = ["derive", "env", "string", "wrap_help"] } # R0.12
clap_complete = "=4.6.11"                                                 # R0.12
dirs = "=7.0.0"                                                           # R0.12 (user cache dir)
ed25519-dalek = "=3.0.0"                                                  # R0.5 archive signature
hex = "=0.4.3"                                                            # R0.5
inquire = { version = "=0.9.4", default-features = false, features = ["crossterm"] } # R0.12
libc = "=0.2.191"                                                         # R0.4 process groups
linkme = "=0.3.37"                                                        # R0.3 registration
# R0.2 features. preserve_order keeps the insertion order of maps that the converter builds.
minijinja = { version = "=3.0.3", features = ["builtins", "json", "loop_controls", "macros", "serde", "preserve_order", "urlencode"] }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }           # R0.5 lock JSON (no preserve_order)
sha2 = "=0.11.1"                                                          # R0.5
signal-hook = "=0.4.5"                                                    # R0.4 (Unix signal handler)
tar = "=0.4.46"                                                           # R0.5 archives
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.1.8"                                                           # R0.2
toml_edit = "=0.25.17"                                                    # R0.12
tree-sitter = "=0.27.1"                                                   # R0.1 splice editor
tree-sitter-yaml = "=0.7.2"                                               # R0.1
# R0.4: rustls with the ring provider and the WebPKI roots. No aws-lc (deny.toml bans it).
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
walkdir = "=2.5.0"
yaml_serde = "=0.10.7"                                                    # R0.2 (YAML decode only, no editing)
zstd = "=0.14.3"                                                          # R0.5 archives

# Test-only crates.
similar = "=3.2.1"                                                        # R0.2 golden diffs

# R2: the kit (crates/spinup-kit). The kit manifest repeats these versions as caret requirements.
# It does not inherit these lines (ADR 0021 §2). They are the pin record that kit_manifest.rs
# checks, and the versions that the root lock must hold.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }        # R0.7
async-trait = "=0.1.92"                                                               # R0.7
aws-lc-rs = { version = "=1.18.2", default-features = false, features = ["aws-lc-sys", "alloc", "prebuilt-nasm"] } # R0.7; prebuilt-nasm for Windows
axum = { version = "=0.8.9", features = ["macros"] }                                  # R0.6
fastrand = "=2.5.0"                                                                   # R0.8
flate2 = "=1.1.10"                                                                    # R0.9 apidocs
form_urlencoded = "=1.2.2"                                                            # R0.6
futures = "=0.3.34"                                                                   # R0.8
http-body-util = "=0.1.5"                                                             # R0.6
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] } # R0.7; aws_lc_rs (ADR 0019 §3)
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "file-transport", "hostname"] } # R0.7
mime_guess = "=2.0.5"                                                                 # spa Content-Type
oauth2 = { version = "=5.0.0", default-features = false }                             # R0.7
opentelemetry = { version = "=0.33.1", features = ["trace", "metrics", "logs"] }      # R0.8
opentelemetry-appender-tracing = "=0.33.1"                                            # R0.8
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "reqwest-client", "trace", "metrics", "logs"] } # R0.8
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] } # R0.8 (kit tests)
opentelemetry_sdk = { version = "=0.33.1", features = ["rt-tokio", "trace", "metrics", "logs", "experimental_trace_batch_span_processor_with_async_runtime", "experimental_metrics_periodicreader_with_async_runtime", "experimental_logs_batch_log_processor_with_async_runtime"] } # R0.8
prost = "=0.14.4"                                                                     # R0.8 (kit tests)
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "form"] } # R0.7, R0.8
serde_path_to_error = "=0.1.20"                                                       # R0.6
serde_urlencoded = "=0.7.1"                                                           # R0.6
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "time", "json", "derive"] } # R0.6
subtle = "=2.6.1"                                                                     # R0.7
time = { version = "=0.3.55", features = ["serde", "serde-human-readable", "formatting", "parsing", "macros"] } # R0.6
tokio = { version = "=1.54.1", features = ["full"] }                                  # R0.6
tower = { version = "=0.5.3", features = ["util"] }                                   # R0.6
tower-http = { version = "=0.7.1", features = ["catch-panic", "limit"] }              # R2 pre-seed (not in a spike lock)
tracing = "=0.1.44"                                                                   # R0.6
tracing-opentelemetry = "=0.34.0"                                                     # R0.8
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json", "fmt"] } # R0.6
url = "=2.5.8"                                                                        # R0.7
utoipa = { version = "=6.0.0", features = ["yaml", "uuid", "time", "axum_extras"] }   # R0.6; never preserve_order
utoipa-axum = "=0.3.0"                                                                # R0.6; generated apps only (pin record)
uuid = { version = "=1.29.0", features = ["v4", "v7", "serde"] }                     # R0.6

# R0.12: the release profile of the CLI.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
