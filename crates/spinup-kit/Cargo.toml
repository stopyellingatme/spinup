# spinup-kit: the runtime library of the apps that spinup generates (ADR 0021 §2).
# Main loop only. This manifest does not inherit from the workspace: a Docker build with
# SPINUP_KIT_REPLACE copies only this directory. crates/spinup-newapp/tests/it/kit_manifest.rs
# checks each version against the root [workspace.dependencies] and the stack pin.
[package]
name = "spinup-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stopyellingatme/spinup"
description = "The runtime library of the apps that spinup generates"
publish = false   # R4 publishes it, with the approval of the user (ADR 0019 §1)

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
disallowed_methods = "warn"
disallowed_types = "warn"
disallowed_macros = "warn"

[features]
default = ["db"]
db = ["dep:sqlx"]
# auth has url: auth::reset (auth + mail) calls url::Url::parse (r0-09 kit/src/auth/reset.rs:82).
auth = ["db", "dep:argon2", "dep:async-trait", "dep:aws-lc-rs", "dep:base64", "dep:hex", "dep:sha2", "dep:url"]
oidc = ["auth", "dep:jsonwebtoken", "dep:oauth2", "dep:reqwest", "dep:url"]
# mail has async-trait: Mailer is an async trait (r0-09 kit/src/mail.rs:7).
mail = ["dep:async-trait", "dep:lettre", "dep:minijinja"]
# auth and jobs do not imply telemetry. Their metric calls are #[cfg(feature = "telemetry")] (ADR 0021 §2).
jobs = ["db", "dep:fastrand", "dep:futures"]
telemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-appender-tracing", "dep:tracing-opentelemetry", "dep:reqwest"]
devtools = []
embedweb = ["dep:mime_guess"]
apidocs = ["dep:flate2"]
# The test helpers (Go kit/testkit and kit/auth/authtest), the fake OIDC issuer, and the SMTP stub.
testkit = ["db", "dep:hex", "dep:sha2", "dep:url"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
form_urlencoded = "1.2.2"
http-body-util = "0.1.5"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "serde-human-readable", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
utoipa = { version = "6.0.0", features = ["yaml", "uuid", "time", "axum_extras"] }
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
# Optional (features above).
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"], optional = true }
async-trait = { version = "0.1.92", optional = true }
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys", "alloc", "prebuilt-nasm"], optional = true }
base64 = { version = "0.23.1", optional = true }
fastrand = { version = "2.5.0", optional = true }
flate2 = { version = "1.1.10", optional = true }
futures = { version = "0.3.34", optional = true }
hex = { version = "0.4.3", optional = true }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"], optional = true }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "file-transport", "hostname"], optional = true }
mime_guess = { version = "2.0.5", optional = true }
minijinja = { version = "3.0.3", optional = true }
oauth2 = { version = "5.0.0", default-features = false, optional = true }
opentelemetry = { version = "0.33.1", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry-appender-tracing = { version = "0.33.1", optional = true }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-client", "trace", "metrics", "logs"], optional = true }
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio", "trace", "metrics", "logs", "experimental_trace_batch_span_processor_with_async_runtime", "experimental_metrics_periodicreader_with_async_runtime", "experimental_logs_batch_log_processor_with_async_runtime"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"], optional = true }
sha2 = { version = "0.11.1", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "time", "json", "derive"], optional = true }
tracing-opentelemetry = { version = "0.34.0", optional = true }
url = { version = "2.5.8", optional = true }

[dev-dependencies]
# The self dependency turns on every feature for the tests and for clippy --all-targets, so
# lane checks compile all feature code (map-kit §7 R4). Kit tests that use the testkit live
# in tests/it/.
spinup-kit = { path = ".", features = ["auth", "oidc", "mail", "jobs", "telemetry", "devtools", "embedweb", "apidocs", "testkit"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33.1", features = ["testing"] }
prost = "0.14.4"
tempfile = "3.27.0"
